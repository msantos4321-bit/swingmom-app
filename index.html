<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>SwingMom</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--tx:#1C1C1E;--tx2:#6C6C70;--ac:#0062CC;--acbg:#E4EEFB;--ok:#1B6B33;--okbg:#E3F4E8;--bad:#B3261E;--badbg:#FCE8E6;--warn:#8A4B00;--warnbg:#FFF1DC;--line:#E5E5EA;--chip:#EDEDF2}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--tx:#F2F2F7;--tx2:#A1A1A6;--ac:#4DA3FF;--acbg:#16304F;--ok:#5BD07A;--okbg:#14301D;--bad:#FF8A80;--badbg:#3A1B19;--warn:#FFC266;--warnbg:#3A2A12;--line:#38383A;--chip:#2C2C2E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 24px) 16px calc(100px + env(safe-area-inset-bottom))}
h1{font-size:34px;letter-spacing:-.02em;margin:2px 0 0}h2{font-size:20px;margin:20px 4px 8px;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--tx2);font-weight:500}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px}
.pad{padding:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 16px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .k{font-size:15px;color:var(--tx2)}.row .v{font-size:17px;font-weight:600;white-space:nowrap}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-height:64px}.item:last-child{border:0}
.grow{flex:1;min-width:0}.t{font-size:17px;font-weight:600}.s{font-size:13px;color:var(--tx2)}.r{text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--tx);margin-left:6px;vertical-align:middle}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.ac{background:var(--acbg);color:var(--ac)}
.up{color:var(--ok)}.dn{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;height:calc(84px + env(safe-area-inset-bottom) - 20px);padding:8px 8px calc(env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line);max-width:520px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--tx2);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;cursor:pointer}
nav button.on{color:var(--ac)}nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;border:0;background:var(--ac);color:#fff;font-size:17px;font-weight:600;width:100%;cursor:pointer;margin-top:8px}
.btn.sec{background:var(--acbg);color:var(--ac)}
input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);padding:0 14px;font-size:16px;margin-top:8px;font-family:inherit}
.seg{display:flex;padding:2px;border-radius:10px;background:var(--chip);margin:12px 0}.seg button{flex:1;min-height:32px;border:0;border-radius:8px;background:none;color:var(--tx2);font-size:14px;font-weight:600}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.aviso{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;margin-top:12px}
.back{background:none;border:0;color:var(--ac);font-size:17px;min-height:44px;padding:0;cursor:pointer}
canvas{width:100%;height:240px;display:block}
.muted{color:var(--tx2);font-size:14px;line-height:1.45}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.42;margin:8px 0;word-wrap:break-word}
.bub.u{margin-left:auto;background:var(--ac);color:#fff;border-bottom-right-radius:6px}
.bub.a{background:var(--card);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);max-width:96%}
.bub.err{background:var(--badbg);color:var(--bad)}
.bub .meta{font-size:12px;color:var(--tx2);margin-top:8px}
.bub .src{display:inline-block;font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--chip);color:var(--ac);text-decoration:none;margin:6px 6px 0 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tx2);margin-right:4px;animation:pp 1.2s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pp{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(20px)}
.composer textarea{flex:1;min-height:44px;max-height:120px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--tx);padding:11px 16px;font-size:16px;font-family:inherit;resize:none;margin:0}
.composer button{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}.composer button:disabled{opacity:.4}
.composer svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chips button{border:0;border-radius:16px;background:var(--acbg);color:var(--ac);font-size:14px;font-weight:600;padding:9px 14px;cursor:pointer;min-height:36px}
.steps{margin:10px 0 0;padding-left:20px;font-size:15px;line-height:1.5}.steps li{margin-bottom:6px}.steps a{color:var(--ac);font-weight:600}
.linkbtn{background:none;border:0;color:var(--ac);font-size:14px;cursor:pointer;padding:6px 0;min-height:32px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const money=n=>n==null?'—':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CFG=window.SWINGMOM_CONFIG;
function leerClave(){let k=null;const m=location.hash.match(/k=([A-Za-z0-9_-]+)/);try{if(m){k=m[1];localStorage.setItem('smk',k)}else k=localStorage.getItem('smk')}catch(e){if(m)k=m[1]}return k}
const KEY=leerClave();
const sb=KEY?supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{global:{headers:{'x-sm-key':KEY}},auth:{persistSession:false,autoRefreshToken:false}}):null;
if(KEY&&!location.hash.includes('k='))history.replaceState(null,'','#k='+KEY);
if(KEY){try{const m={name:'SwingMom',short_name:'SwingMom',start_url:location.pathname+'#k='+KEY,scope:location.pathname,display:'standalone',background_color:'#F2F2F7',theme_color:'#F2F2F7',icons:[{src:new URL('icon.svg',location.href).href,sizes:'any',type:'image/svg+xml',purpose:'any'}]};const l=document.querySelector('link[rel=manifest]');l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))}catch(e){}}
const ICON={hoy:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',cartera:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',lab:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>',claude:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'};
let S={tab:'hoy',scan:null,velas:{},pos:[],robots:[],ops:[],filtro:'Todas',det:null};
const CLASE={NUCLEO:['Núcleo','ok','2% de riesgo'],CALIFICADA:['Calificada','ac','1% de riesgo'],ROBOT:['Solo robot','','Cuenta simulada'],VIGILANCIA:['Vigilancia','','Sin entrada']};
const RISK={NUCLEO:.02,CALIFICADA:.01};
const CAP=10000,MAXPOS=3000;

function nav(){const n=$('#nav');n.hidden=false;n.innerHTML=[['hoy','Hoy'],['cartera','Cartera'],['lab','Laboratorio'],['claude','Claude']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-k="${k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg><span>${l}</span></button>`).join('');
 n.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;S.det=null;render()})}

function sinClave(msg){$('#nav').hidden=true;app.innerHTML=`<div class="sub">Acceso privado</div><h1>SwingMom</h1><div class="card pad" style="margin-top:20px"><p class="muted" style="margin:0">${msg||'Abre tu enlace privado una vez y la app queda lista en este dispositivo. También puedes pegarlo aquí:'}</p><input id="lk" placeholder="Pega tu enlace privado"><button class="btn" id="go">Entrar</button></div>`;$('#go').onclick=()=>{const m=$('#lk').value.match(/k=([A-Za-z0-9_-]+)/);if(m){try{localStorage.setItem('smk',m[1])}catch(e){}location.hash='k='+m[1];location.reload()}}}

async function load(){
 const[a,b,c,d,e]=await Promise.all([
  sb.from('sm_scans').select('creado_en,scan_time,version,mercado_ok,mercado_txt,resumen,payload').order('creado_en',{ascending:false}).limit(1),
  sb.from('sm_posiciones').select('*').eq('estado','abierta').order('cuenta'),
  sb.from('sm_robots').select('*').order('creado_en'),
  sb.from('sm_robot_operaciones').select('robot_id,estado,resultado_r'),
  sb.from('sm_velas').select('ticker,barras')]);
 S.err=a.error?a.error.message:null;S.scan=a.data?.[0]||null;S.pos=b.data||[];S.robots=c.data||[];S.ops=d.data||[];S.velas={};(e.data||[]).forEach(v=>S.velas[v.ticker]=v.barras);try{await cargarLab()}catch(x){}try{await cargarCmd()}catch(x){}try{await cargarPush()}catch(x){}}
async function cargarCmd(){const r=await sb.from('sm_comandos').select('*').order('creado_en',{ascending:false}).limit(1);S.cmd=r.data?.[0]||null}
const PUSH_OK=()=>('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window);
S.push={est:'?',ult:null,msg:''};
const listo=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('sw')),ms))]);
async function cargarPush(){S.push.msg='';if(!PUSH_OK()){S.push.est='nosoporta';return}
 if(Notification.permission==='denied'){S.push.est='bloqueado';return}
 try{const reg=await listo(navigator.serviceWorker.ready,3000);const sub=await reg.pushManager.getSubscription();S.push.est=(sub&&Notification.permission==='granted')?'activo':'inactivo';
  if(S.push.est==='activo'){const j=sub.toJSON();await sb.from('sm_push_subs').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,agente:navigator.userAgent.slice(0,150),activo:true},{onConflict:'endpoint'})}}catch(x){S.push.est='inactivo'}
 try{const r=await sb.from('sm_notificaciones').select('creado_en,titulo').order('creado_en',{ascending:false}).limit(1);S.push.ult=r.data?.[0]||null}catch(x){}}
function u8(b){const p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))}
function avisosBox(){const e=S.push.est,u=S.push.ult;let h='';
 if(e==='nosoporta')h='<p class="muted" style="margin:0;font-size:13px">Para recibir avisos en iPhone, abre SwingMom desde su ícono en la pantalla de inicio (no desde Safari).</p>';
 else if(e==='bloqueado')h='<p class="muted" style="margin:0;font-size:13px">Las notificaciones están bloqueadas para SwingMom en este teléfono. Actívalas en Ajustes del teléfono.</p>';
 else if(e==='inactivo')h='<button class="btn sec" id="pa" style="margin-top:0">Activar avisos en este teléfono</button><p class="muted" style="margin:10px 2px 0;font-size:13px">Te aviso cuando termina el escaneo del mediodía (con las señales Núcleo y Calificadas) y si algo del sistema falla.</p>';
 else if(e==='activo')h=`<div class="row"><span class="k">Avisos</span><span class="v" style="color:var(--ok,#1a7f37)">Activados ✓</span></div>${u?`<p class="muted" style="margin:6px 2px 0;font-size:13px">Último: ${esc(u.titulo)} · ${new Date(u.creado_en).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'short',timeStyle:'short'})}</p>`:''}${S.push.msg?`<p class="muted" style="margin:6px 2px 0;font-size:13px">${esc(S.push.msg)}</p>`:''}<div style="display:flex;gap:8px;margin-top:10px"><button class="btn sec" id="pt" style="margin-top:0;min-height:42px;font-size:15px">Enviar prueba</button><button class="btn sec" id="pd" style="margin-top:0;min-height:42px;font-size:15px">Desactivar</button></div>`;
 return h?`<div class="card pad" style="margin-top:12px">${h}</div>`:''}
async function activarPush(){const b=$('#pa');if(b){b.disabled=true;b.textContent='Activando…'}
 try{const perm=await Notification.requestPermission();if(perm!=='granted'){S.push.est=perm==='denied'?'bloqueado':'inactivo';render();return}
  const c=await sb.from('sm_config').select('valor').eq('clave','vapid_public').limit(1);const vp=c.data?.[0]?.valor;
  if(!vp){alert('Los avisos todavía no están listos en el servidor (se activan con el primer escaneo tras la actualización). Intenta de nuevo en unos minutos.');S.push.est='inactivo';render();return}
  const reg=await listo(navigator.serviceWorker.ready,5000);let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(vp)});
  const j=sub.toJSON();const r=await sb.from('sm_push_subs').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,agente:navigator.userAgent.slice(0,150),activo:true,fallos:0},{onConflict:'endpoint'});
  if(r.error)throw new Error(r.error.message);S.push.est='activo'}catch(e){alert('No se pudieron activar los avisos: '+e.message);S.push.est='inactivo'}render()}
async function desactivarPush(){try{const reg=await listo(navigator.serviceWorker.ready,3000);const sub=await reg.pushManager.getSubscription();if(sub){await sb.from('sm_push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}catch(e){}S.push.est='inactivo';render()}
async function pruebaPush(){const r=await sb.from('sm_comandos').insert({tipo:'probar_aviso'});if(r.error){alert('No se pudo pedir la prueba: '+r.error.message);return}S.push.msg='Prueba pedida: llega cuando GitHub la revise (hasta 15 min en horario de mercado).';render()}
function cmdBox(){const c=S.cmd,min=c?(Date.now()-new Date(c.creado_en))/6e4:1e9;let msg='',busy=false;
 if(c&&c.estado==='pendiente'&&min<60){busy=true;msg='Pedido enviado. GitHub lo revisa cada 15 min en horario de mercado (L–V, 6:00–14:00 Tijuana); fuera de ese horario se atiende al abrir el siguiente día.'}
 else if(c&&c.estado==='en_proceso'&&min<30){busy=true;msg='Escaneando ahora… tarda cerca de 1 minuto.'}
 else if(c&&c.estado==='listo'&&min<15)msg='Escaneo listo — datos actualizados.';
 else if(c&&c.estado==='error'&&min<60)msg='El último pedido falló'+(c.resultado&&c.resultado.detalle?': '+esc(c.resultado.detalle):'')+'. Revisa Laboratorio → Salud.';
 return `<div class="card pad" style="margin-top:12px"><button class="btn sec" id="esc" style="margin-top:0"${busy?' disabled':''}>${busy?'Escaneo en curso…':'Escanear ahora'}</button>${msg?`<p class="muted" style="margin:10px 2px 0;font-size:13px">${msg}</p>`:''}</div>`}
async function pedirEscaneo(){const b=$('#esc');if(b){b.disabled=true;b.textContent='Enviando…'}
 const r=await sb.from('sm_comandos').insert({tipo:'escanear'});if(r.error){alert('No se pudo enviar el pedido: '+r.error.message);await cargarCmd();render();return}
 await cargarCmd();render();vigilarCmd()}
let _vig=null;function vigilarCmd(){clearInterval(_vig);let n=0;_vig=setInterval(async()=>{n++;try{await cargarCmd()}catch(x){}const c=S.cmd;
 if(c&&(c.estado==='listo'||c.estado==='error')){clearInterval(_vig);_vig=null;if(c.estado==='listo')await load();if(S.tab==='hoy'&&!S.det)render();return}
 if(n>240){clearInterval(_vig);_vig=null;return}if(S.tab==='hoy'&&!S.det)render()},15000)}

function sizing(r){const rk=RISK[r.clase];if(!rk)return null;const riskUsd=CAP*rk,dist=r.price-r.stop;if(dist<=0)return null;
 let sh=Math.floor(riskUsd/dist);sh=Math.min(sh,Math.floor(MAXPOS/r.price));return{sh,val:sh*r.price,riesgo:sh*dist}}

function hoy(){const sc=S.scan;if(!sc){app.innerHTML=`<div class="sub">Sin datos todavía</div><h1>Hoy</h1><p class="muted">Aún no hay ningún escaneo en la base. Lanza el workflow en GitHub (Actions → SwingMom scan → Run workflow).</p>`;return}
 const rs=sc.payload.results.filter(r=>r.tier<=5&&!r.ya_en_otra_cuenta||r.tier<=3);
 const g=c=>sc.payload.results.filter(r=>r.tier<=3&&r.clase===c);
 const fecha=new Date(sc.creado_en).toLocaleString('es-MX',{timeZone:'America/Tijuana',dateStyle:'medium',timeStyle:'short'});
 const blk=(tit,arr,vacio)=>`<h2>${tit}</h2><div class="card">${arr.length?arr.map(it).join(''):`<div class="pad muted">${vacio}</div>`}</div>`;
 const it=r=>{const c=CLASE[r.clase]||['','',''];return`<div class="item" data-tk="${r.ticker}"><div class="grow"><div class="t">${r.ticker}<span class="pill ${c[1]}">${c[0]}</span>${r.ya_en_otra_cuenta?'<span class="pill warn">Ya en otra cuenta</span>':''}</div><div class="s">Tier ${r.tier} · score ${Math.round(r.total_score)} · ${esc(r.sector||'')}</div></div><div class="r"><div class="t">${money(r.price)}</div><div class="s">Stop ${money(r.stop)}</div></div></div>`};
 app.innerHTML=`<div class="sub">${fecha} · hora de Tijuana · v${esc(sc.version)}</div><h1>Hoy</h1>${saludPill()}
 ${cmdBox()}
 ${avisosBox()}
 ${sc.mercado_ok?'':`<div class="aviso"><b>Mercado inactivo (aviso).</b> ${esc(sc.mercado_txt||'')}. No es un veto: el backtest no respalda esperar, pero entra con la disciplina de siempre.</div>`}
 ${blk('Núcleo · 2% de riesgo',g('NUCLEO'),'Hoy no hay señales núcleo.')}
 ${blk('Calificadas · 1% de riesgo',g('CALIFICADA'),'Sin calificadas hoy.')}
 ${blk('Solo robot (simulado)',g('ROBOT'),'Nada para el laboratorio hoy.')}
 ${blk('Vigilancia',sc.payload.results.filter(r=>r.tier===4).slice(0,8),'Sin candidatos cercanos.')}`;
 app.querySelectorAll('.item[data-tk]').forEach(e=>e.onclick=()=>{S.det=e.dataset.tk;render()});const sp=$('#sp');if(sp)sp.onclick=()=>{S.tab='lab';L.vista='salud';render()};const ec=$('#esc');if(ec)ec.onclick=pedirEscaneo;const pa=$('#pa');if(pa)pa.onclick=activarPush;const pt=$('#pt');if(pt)pt.onclick=pruebaPush;const pd=$('#pd');if(pd)pd.onclick=desactivarPush;if(!_vig&&S.cmd&&['pendiente','en_proceso'].includes(S.cmd.estado)&&(Date.now()-new Date(S.cmd.creado_en))<36e5)vigilarCmd()}

function velas(canvas,bars,r){const dpr=devicePixelRatio||1,W=canvas.clientWidth,H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;const x=canvas.getContext('2d');x.scale(dpr,dpr);
 const b=bars.slice(-90);const hi=Math.max(...b.map(v=>v.h),r.tp2||0),lo=Math.min(...b.map(v=>v.l),r.stop||1e9);const pad=(hi-lo)*.05,mx=hi+pad,mn=lo-pad;
 const Y=p=>H-16-(p-mn)/(mx-mn)*(H-24),w=W/b.length,css=getComputedStyle(document.documentElement);
 const up=css.getPropertyValue('--ok'),dn=css.getPropertyValue('--bad'),tx2=css.getPropertyValue('--tx2');
 [[r.tp2,up],[r.tp1,up],[r.price,tx2],[r.stop,dn]].forEach(([p,c])=>{if(!p)return;x.strokeStyle=c;x.setLineDash([4,4]);x.beginPath();x.moveTo(0,Y(p));x.lineTo(W,Y(p));x.stroke()});x.setLineDash([]);
 b.forEach((v,i)=>{const c=v.c>=v.o?up:dn,cx=i*w+w/2;x.strokeStyle=c;x.fillStyle=c;x.beginPath();x.moveTo(cx,Y(v.h));x.lineTo(cx,Y(v.l));x.stroke();const t=Y(Math.max(v.o,v.c)),h=Math.max(1,Math.abs(Y(v.o)-Y(v.c)));x.fillRect(cx-w*.35,t,w*.7,h)})}

function detalle(){const r=S.scan.payload.results.find(x=>x.ticker===S.det);const c=CLASE[r.clase]||['','',''];const sz=sizing(r);const bars=S.velas[r.ticker];
 app.innerHTML=`<button class="back" id="bk">‹ Hoy</button><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><h1>${r.ticker}</h1><div class="sub">${esc(r.tier_label||'Tier '+r.tier)} · ${esc(r.sector||'')}</div></div><span class="pill ${c[1]}" style="font-size:14px;padding:8px 14px;border-radius:999px">${c[0]}</span></div>
 <div class="card" style="margin-top:16px">${bars?'<canvas id="cv"></canvas>':'<div class="pad muted">Sin velas guardadas para este ticker (se guardan Tier 1–4 y tu cartera).</div>'}</div>
 <div class="card">
 <div class="row"><span class="k">Entrada ideal</span><span class="v">${money(r.price)}</span></div>
 <div class="row"><span class="k">Stop</span><span class="v dn">${money(r.stop)}</span></div>
 <div class="row"><span class="k">TP1 · stop a breakeven</span><span class="v up">${money(r.tp1)}</span></div>
 <div class="row"><span class="k">TP2 · salida final</span><span class="v up">${money(r.tp2)}</span></div>
 <div class="row"><span class="k">Tamaño (${c[2]})</span><span class="v">${sz?sz.sh+' acc. · '+money(sz.val):'—'}</span></div>
 <div class="row"><span class="k">Riesgo en dólares</span><span class="v">${sz?money(sz.riesgo):'—'}</span></div>
 <div class="row"><span class="k">Earnings</span><span class="v">${esc(r.earn_label||'—')}</span></div>
 <div class="row"><span class="k">Rango 52 sem. · RS</span><span class="v">${Math.round(r.pos52)}% · ${r.rs_rating}</span></div>
 <div class="row"><span class="k">Escenario histórico</span><span class="v">${esc(r.escenario_label||'—')}</span></div></div>
 <p class="muted" style="padding:0 4px">Tamaño sobre $10,000, tope $3,000 por posición. Antes de entrar: verificación con Claude (pestaña Claude). El stop debe ser una orden real en el broker.</p>
 <button class="btn" id="vr">Verificar con Claude</button>`;
 $('#bk').onclick=()=>{S.det=null;render()};$('#vr').onclick=()=>{S.tab='claude';S.ctx=r.ticker;S.det=null;render()};if(bars)velas($('#cv'),bars,r)}

function cartera(){const f=S.filtro,lista=S.pos.filter(p=>f==='Todas'||p.cuenta===f);const last={};(S.scan?.payload.results||[]).forEach(r=>last[r.ticker]=r.price);
 const grupo=c=>{const l=lista.filter(p=>p.cuenta===c);if(!l.length)return'';return`<h2>${c==='IBKR'?'Interactive Brokers':'eToro'}</h2><div class="card">${l.map(p=>{const px=last[p.ticker],pl=px&&p.entrada&&p.acciones&&p.tipo!=='apalancada'?(px-p.entrada)*p.acciones:null,pc=px&&p.entrada?(px/p.entrada-1)*100:null;
  return`<div class="item"><div class="grow"><div class="t">${esc(p.ticker)}<span class="pill ${p.tipo==='apalancada'?'warn':''}">${p.tipo==='apalancada'?'Apalancada':'Acciones'}</span>${px&&p.stop&&px<=p.stop?'<span class="pill bad">Bajo el stop</span>':''}</div><div class="s">${p.acciones??'—'} u. · Entrada ${money(p.entrada)}</div><div class="s">Stop ${money(p.stop)} · TP ${money(p.tp)}</div></div><div class="r"><div class="t ${pl>=0?'up':'dn'}">${pl==null?'—':(pl>=0?'+':'')+money(pl)}</div><div class="s ${pc>=0?'up':'dn'}">${pc==null?'':(pc>=0?'+':'')+pc.toFixed(1)+'%'}</div></div></div>`}).join('')}</div>`};
 app.innerHTML=`<div class="sub">Precios del último escaneo</div><h1>Cartera</h1><div class="seg">${['Todas','IBKR','eToro'].map(x=>`<button class="${f===x?'on':''}" data-f="${x}">${x}</button>`).join('')}</div>${grupo('IBKR')||''}${grupo('eToro')||''}${lista.length?'':'<p class="muted">Sin posiciones registradas. Se cargan desde una captura (Claude la lee y las registra) — Fase 3.</p>'}
 <button class="btn sec" id="add">Registrar posición</button>`;
 app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.filtro=b.dataset.f;render()});
 $('#add').onclick=()=>{app.insertAdjacentHTML('beforeend',`<div class="card pad" style="margin-top:12px"><select id="fc"><option>IBKR</option><option>eToro</option></select><select id="ft"><option value="acciones">Acciones</option><option value="apalancada">Apalancada</option></select><input id="fk" placeholder="Ticker"><input id="fa" type="number" step="any" placeholder="Acciones / unidades"><input id="fe" type="number" step="any" placeholder="Entrada"><input id="fs" type="number" step="any" placeholder="Stop"><input id="fp" type="number" step="any" placeholder="Take profit"><button class="btn" id="sv">Guardar</button></div>`);
  $('#sv').onclick=async()=>{const n=id=>$(id).value?Number($(id).value):null;await sb.from('sm_posiciones').insert({cuenta:$('#fc').value,tipo:$('#ft').value,ticker:$('#fk').value.toUpperCase().trim(),acciones:n('#fa'),entrada:n('#fe'),stop:n('#fs'),tp:n('#fp'),abierta_en:new Date().toISOString().slice(0,10)});await load();render()}}}

// ── Claude: chat y verificación (la llave de Anthropic vive solo en la función de Supabase) ──
const FN=CFG.SUPABASE_URL+'/functions/v1/claude-chat';
const CL={estado:null,msgs:[],cargado:false,espera:null,poll:null,err:null,draft:''};
const clDesde=()=>{try{return localStorage.getItem('clDesde')||null}catch(e){return null}};
async function clFn(body){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json','x-sm-key':KEY,apikey:CFG.SUPABASE_ANON_KEY},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch(e){}return{...j,status:r.status}}
async function clEstado(){try{const r=await clFn({accion:'estado'});CL.estado=r.status===200?r:{ok:false,status:r.status}}catch(e){CL.estado={ok:false,red:true}}}
async function clCargar(){let q=sb.from('sm_chat').select('*').order('creado_en',{ascending:false}).limit(30);const d=clDesde();if(d)q=q.gte('creado_en',d);const r=await q;CL.msgs=(r.data||[]).reverse();CL.cargado=true;
 const p=CL.msgs.filter(m=>m.rol==='assistant'&&m.contexto&&m.contexto.estado==='pensando'&&Date.now()-new Date(m.creado_en)<18e4).pop();if(p)clVigilar(p.id)}
function clVigilar(id){CL.espera=id;clearInterval(CL.poll);const t0=Date.now();
 CL.poll=setInterval(async()=>{let fila=null;try{const r=await sb.from('sm_chat').select('*').eq('id',id);fila=r.data&&r.data[0]}catch(e){}
  const vencio=Date.now()-t0>18e4;
  if(fila&&fila.contexto&&fila.contexto.estado!=='pensando'||vencio){clearInterval(CL.poll);CL.espera=null;
   const i=CL.msgs.findIndex(m=>m.id===id);const nueva=fila&&fila.contexto&&fila.contexto.estado!=='pensando'?fila:{id,rol:'assistant',contenido:'',creado_en:new Date().toISOString(),contexto:{estado:'error',detalle:'Sin respuesta después de 3 minutos. Intenta de nuevo.'}};
   if(i>=0)CL.msgs[i]=nueva;else CL.msgs.push(nueva);pintarChat()}},3000)}
async function clEnviar(texto,modo,ticker){texto=(texto||'').trim();if(CL.espera||!texto)return;CL.err=null;
 CL.msgs.push({rol:'user',contenido:texto,creado_en:new Date().toISOString(),contexto:{}});const tmp={rol:'assistant',contenido:'',creado_en:new Date().toISOString(),contexto:{estado:'pensando'}};CL.msgs.push(tmp);CL.espera='tmp';pintarChat();
 let r;try{r=await clFn({mensaje:texto,modo:modo||'chat',ticker:ticker||null,desde:clDesde()})}catch(e){r={status:0}}
 if(r.status!==202){CL.msgs.pop();CL.msgs.pop();CL.espera=null;
  CL.err=r.status===503?null:r.status===429?(r.detalle||'Llegaste al tope diario de respuestas.'):r.status===401?'La clave privada de este dispositivo no coincide con la del servidor. Abre de nuevo tu enlace privado.':'No pude contactar al servicio de Claude. Revisa tu conexión e intenta de nuevo.';
  if(r.status===503)CL.estado={ok:true,llave:false};CL.draft=texto;if(S.tab==='claude')claudeTab();return}
 tmp.id=r.id;CL.draft='';const ci=$('#cin');if(ci){ci.value='';ci.style.height='auto'}clVigilar(r.id)}
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,3}\s*(.+)$/gm,'<b>$1</b>').replace(/^[-*]\s+/gm,'• ').replace(/\n/g,'<br>');
const VERD={ENTRAR:['Entrar','ok'],ENTRAR_REDUCIDO:['Entrar reducido','warn'],ESPERAR:['Esperar','warn'],DESCARTAR:['Descartar','bad']};
const TEMA={dilucion:'Dilución',litigio:'Litigio',guia_earnings:'Guía/earnings',insiders:'Insiders',valuacion:'Valuación',sector:'Sector',extension:'Extensión'};
function burbuja(m){if(m.rol==='user')return `<div class="bub u">${esc(m.contenido)}</div>`;const c=m.contexto||{};
 if(c.estado==='pensando'){if(Date.now()-new Date(m.creado_en)>18e4&&!m._tmp)return `<div class="bub a err">Esta respuesta no llegó. Intenta de nuevo.</div>`;return `<div class="bub a"><span class="dots"><i></i><i></i><i></i></span><span class="muted"> Investigando… si busca noticias puede tardar 1–2 min</span></div>`}
 if(c.estado==='error')return `<div class="bub a err">${esc(c.detalle||'Algo falló. Intenta de nuevo.')}</div>`;
 const v=c.veredicto&&VERD[c.veredicto]?`<div style="margin-bottom:8px"><span class="pill ${VERD[c.veredicto][1]}" style="margin:0;font-size:13px;padding:3px 10px">${VERD[c.veredicto][0]}</span>${(c.banderas||[]).map(b=>`<span class="pill ${b.color==='rojo'?'bad':b.color==='amarillo'?'warn':'ok'}" title="${esc(b.nota||'')}">${esc(TEMA[b.tema]||b.tema)}</span>`).join('')}</div>`:'';
 const src=(c.fuentes||[]).filter(f=>/^https?:\/\//.test(f.url)).map(f=>{let h=f.url;try{h=new URL(f.url).hostname.replace(/^www\./,'')}catch(e){}return `<a class="src" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer" title="${esc(f.titulo||'')}">${esc(h)}</a>`}).join('');
 const meta=c.costo_usd!=null?`<div class="meta">${esc((c.modelo||'').replace('claude-',''))}${c.busquedas?` · ${c.busquedas} búsquedas`:''} · ≈ $${Number(c.costo_usd).toFixed(3)}</div>`:'';
 return `<div class="bub a">${v}${md(m.contenido)}${src?`<div>${src}</div>`:''}${meta}</div>`}
function pintarChat(){const el=$('#msgs');if(!el)return;el.innerHTML=CL.msgs.length?CL.msgs.map(burbuja).join(''):'';const sd=$('#csd');if(sd)sd.disabled=!!CL.espera||!(CL.estado&&CL.estado.ok&&CL.estado.llave);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function claudeTab(){const e=CL.estado;
 const listo=e&&e.ok&&e.llave;
 let est='';
 if(!e)est=`<div class="card pad"><p class="muted" style="margin:0">Conectando con Claude…</p></div>`;
 else if(!e.ok)est=`<div class="card pad"><p class="muted" style="margin:0">${e.status===404?'El servicio de Claude todavía no está instalado en Supabase.':e.status===401?'La clave privada de este dispositivo no coincide con la del servidor. Abre de nuevo tu enlace privado.':'No pude contactar al servicio de Claude. Revisa tu conexión.'}</p><button class="btn sec" id="cre">Revisar de nuevo</button></div>`;
 else if(!e.llave)est=`<div class="card pad"><div class="t">Falta un paso (una sola vez)</div><p class="muted" style="margin:6px 0 0">Claude necesita tu llave de Anthropic API. Se guarda solo en el servidor; esta app nunca la ve.</p><ol class="steps"><li>Crea la llave en <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com → API keys</a> y cópiala.</li><li>Si es tu primera vez, agrega saldo en <a href="https://console.anthropic.com/settings/billing" target="_blank" rel="noopener">Billing</a> (con $10 alcanza para semanas).</li><li>Pégala en <a href="https://supabase.com/dashboard/project/xbmdgrxceuttvbactugw/functions/secrets" target="_blank" rel="noopener">Supabase → Edge Functions → Secrets</a>, con el nombre <b>ANTHROPIC_API_KEY</b>.</li></ol><button class="btn" id="cre">Ya la pegué — revisar</button></div>`;
 else est=`<div class="muted" style="margin:6px 4px 0">Conectado · ${esc((e.modelo||'').replace('claude-',''))}</div>`;
 const ban=S.ctx&&listo?`<div class="card pad"><div class="t">Verificar ${esc(S.ctx)}</div><p class="muted" style="margin:4px 0 0">Estructura del escáner + búsqueda de noticias, dilución, earnings, insiders y sector. Termina con veredicto y niveles.</p><button class="btn" id="cvr">Lanzar verificación</button></div>`:'';
 const sug=listo&&!CL.msgs.length&&!S.ctx?`<div class="chips">${['Verifica las señales núcleo de hoy','¿Cómo está el mercado hoy?','¿Cómo van mis robots?'].map(x=>`<button data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:'';
 const nuevo=CL.msgs.length?`<button class="linkbtn" id="cnu">Nueva conversación</button>`:'';
 app.innerHTML=`<div class="sub">Con tu cartera y el escáner como contexto</div><h1>Claude</h1>${est}${ban}${sug}${CL.err?`<div class="aviso">${esc(CL.err)}</div>`:''}<div id="msgs"></div>${nuevo}<div style="height:76px"></div>
 <div class="composer"><textarea id="cin" rows="1" placeholder="${listo?'Pregunta lo que quieras…':'Disponible cuando Claude esté conectado'}" ${listo?'':'disabled'}></textarea><button id="csd" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>`;
 const cin=$('#cin');cin.value=CL.draft||'';const ajusta=()=>{cin.style.height='auto';cin.style.height=Math.min(cin.scrollHeight,120)+'px'};ajusta();
 cin.oninput=()=>{CL.draft=cin.value;ajusta()};cin.onkeydown=ev=>{if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();$('#csd').click()}};
 $('#csd').onclick=()=>{clEnviar(cin.value,'chat',null)};
 const cre=$('#cre');if(cre)cre.onclick=async()=>{CL.estado=null;claudeTab();await clEstado();if(S.tab==='claude')claudeTab()};
 const cvr=$('#cvr');if(cvr)cvr.onclick=()=>{const tk=S.ctx;S.ctx=null;claudeTab();clEnviar(`Verifica ${tk} con el protocolo completo y dame el veredicto con niveles.`,'verificar',tk)};
 app.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>clEnviar(b.dataset.q,'chat',null));
 const cnu=$('#cnu');if(cnu)cnu.onclick=()=>{try{localStorage.setItem('clDesde',new Date().toISOString())}catch(x){}CL.msgs=[];CL.err=null;claudeTab()};
 pintarChat();
 if(!e)clEstado().then(()=>{if(S.tab==='claude')claudeTab()});
 if(!CL.cargado)clCargar().then(()=>{if(S.tab==='claude')pintarChat()}).catch(()=>{CL.cargado=true})}

function render(){nav();if(S.det&&S.scan)return detalle();({hoy,cartera,lab,claude:claudeTab})[S.tab]()}
const cargarScripts=()=>['esquema.js','lab.js'].reduce((p,f)=>p.then(()=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=f;e.onload=ok;e.onerror=()=>no(new Error('No cargó '+f));document.head.appendChild(e)})),Promise.resolve());
async function start(){if(!sb)return sinClave();try{await cargarScripts()}catch(e){app.innerHTML='<p class="muted">'+esc(e.message)+'</p>';return}app.innerHTML='<p class="muted">Cargando…</p>';await load();if(S.err){try{localStorage.removeItem('smk')}catch(e){}return sinClave('No se pudo leer con esta clave ('+S.err+'). Abre de nuevo tu enlace privado.')}render()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
