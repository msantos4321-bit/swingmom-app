<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>SwingMom</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--tx:#1C1C1E;--tx2:#6C6C70;--ac:#0062CC;--acbg:#E4EEFB;--ok:#1B6B33;--okbg:#E3F4E8;--bad:#B3261E;--badbg:#FCE8E6;--warn:#8A4B00;--warnbg:#FFF1DC;--line:#E5E5EA;--chip:#EDEDF2}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--tx:#F2F2F7;--tx2:#A1A1A6;--ac:#4DA3FF;--acbg:#16304F;--ok:#5BD07A;--okbg:#14301D;--bad:#FF8A80;--badbg:#3A1B19;--warn:#FFC266;--warnbg:#3A2A12;--line:#38383A;--chip:#2C2C2E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 24px) 16px calc(100px + env(safe-area-inset-bottom))}
h1{font-size:34px;letter-spacing:-.02em;margin:2px 0 0}h2{font-size:20px;margin:20px 4px 8px;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--tx2);font-weight:500}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px}
.pad{padding:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 16px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .k{font-size:15px;color:var(--tx2)}.row .v{font-size:17px;font-weight:600;white-space:nowrap}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-height:64px}.item:last-child{border:0}
.grow{flex:1;min-width:0}.t{font-size:17px;font-weight:600}.s{font-size:13px;color:var(--tx2)}.r{text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--tx);margin-left:6px;vertical-align:middle}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.ac{background:var(--acbg);color:var(--ac)}
.up{color:var(--ok)}.dn{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;height:calc(84px + env(safe-area-inset-bottom) - 20px);padding:8px 8px calc(env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line);max-width:520px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--tx2);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;cursor:pointer}
nav button.on{color:var(--ac)}nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;border:0;background:var(--ac);color:#fff;font-size:17px;font-weight:600;width:100%;cursor:pointer;margin-top:8px}
.btn.sec{background:var(--acbg);color:var(--ac)}
input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);padding:0 14px;font-size:16px;margin-top:8px;font-family:inherit}
.seg{display:flex;padding:2px;border-radius:10px;background:var(--chip);margin:12px 0}.seg button{flex:1;min-height:32px;border:0;border-radius:8px;background:none;color:var(--tx2);font-size:14px;font-weight:600}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.aviso{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;margin-top:12px}
.back{background:none;border:0;color:var(--ac);font-size:17px;min-height:44px;padding:0;cursor:pointer}
canvas{width:100%;height:240px;display:block}
.muted{color:var(--tx2);font-size:14px;line-height:1.45}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.42;margin:8px 0;word-wrap:break-word}
.bub.u{margin-left:auto;background:var(--ac);color:#fff;border-bottom-right-radius:6px}
.bub.a{background:var(--card);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);max-width:96%}
.bub.err{background:var(--badbg);color:var(--bad)}
.bub .meta{font-size:12px;color:var(--tx2);margin-top:8px}
.bub .src{display:inline-block;font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--chip);color:var(--ac);text-decoration:none;margin:6px 6px 0 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tx2);margin-right:4px;animation:pp 1.2s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pp{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(20px)}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;margin:4px 0 10px}.chk input{width:22px;height:22px;min-height:0;margin:0;flex:none}.two{display:flex;gap:8px}.two input{flex:1;min-width:0}.pp{background:var(--chip);padding:12px 16px 16px}
.composer textarea{flex:1;min-height:44px;max-height:120px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--tx);padding:11px 16px;font-size:16px;font-family:inherit;resize:none;margin:0}
.composer button{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}.composer button:disabled{opacity:.4}
.composer svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chips button{border:0;border-radius:16px;background:var(--acbg);color:var(--ac);font-size:14px;font-weight:600;padding:9px 14px;cursor:pointer;min-height:36px}
.steps{margin:10px 0 0;padding-left:20px;font-size:15px;line-height:1.5}.steps li{margin-bottom:6px}.steps a{color:var(--ac);font-weight:600}
.linkbtn{background:none;border:0;color:var(--ac);font-size:14px;cursor:pointer;padding:6px 0;min-height:32px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const money=n=>n==null?'—':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CFG=window.SWINGMOM_CONFIG;
function leerClave(){let k=null;const m=location.hash.match(/k=([A-Za-z0-9_-]+)/);try{if(m){k=m[1];localStorage.setItem('smk',k)}else k=localStorage.getItem('smk')}catch(e){if(m)k=m[1]}return k}
const KEY=leerClave();
const sb=KEY?supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{global:{headers:{'x-sm-key':KEY}},auth:{persistSession:false,autoRefreshToken:false}}):null;
if(KEY&&!location.hash.includes('k='))history.replaceState(null,'','#k='+KEY);
if(KEY){try{const m={name:'SwingMom',short_name:'SwingMom',start_url:location.pathname+'#k='+KEY,scope:location.pathname,display:'standalone',background_color:'#F2F2F7',theme_color:'#F2F2F7',icons:[{src:new URL('icon.svg',location.href).href,sizes:'any',type:'image/svg+xml',purpose:'any'}]};const l=document.querySelector('link[rel=manifest]');l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))}catch(e){}}
const ICON={hoy:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',cartera:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',lab:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>',claude:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'};
let S={tab:'hoy',scan:null,velas:{},pos:[],robots:[],ops:[],filtro:'Todas',det:null};
const CLASE={NUCLEO:['Núcleo','ok','2% de riesgo'],CALIFICADA:['Calificada','ac','1% de riesgo'],ROBOT:['Solo robot','','Cuenta simulada'],VIGILANCIA:['Vigilancia','','Sin entrada']};
const RISK={NUCLEO:.02,CALIFICADA:.01};
const CAP=10000,MAXPOS=3000;

function nav(){const n=$('#nav');n.hidden=false;n.innerHTML=[['hoy','Hoy'],['cartera','Cartera'],['lab','Laboratorio'],['claude','Claude']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-k="${k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg><span>${l}</span></button>`).join('');
 n.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;S.det=null;render()})}

function sinClave(msg){$('#nav').hidden=true;app.innerHTML=`<div class="sub">Acceso privado</div><h1>SwingMom</h1><div class="card pad" style="margin-top:20px"><p class="muted" style="margin:0">${msg||'Abre tu enlace privado una vez y la app queda lista en este dispositivo. También puedes pegarlo aquí:'}</p><input id="lk" placeholder="Pega tu enlace privado"><button class="btn" id="go">Entrar</button></div>`;$('#go').onclick=()=>{const m=$('#lk').value.match(/k=([A-Za-z0-9_-]+)/);if(m){try{localStorage.setItem('smk',m[1])}catch(e){}location.hash='k='+m[1];location.reload()}}}

async function load(){
 const[a,b,c,d,e]=await Promise.all([
  sb.from('sm_scans').select('creado_en,scan_time,version,mercado_ok,mercado_txt,resumen,payload').order('creado_en',{ascending:false}).limit(1),
  sb.from('sm_posiciones').select('*').eq('estado','abierta').order('cuenta'),
  sb.from('sm_robots').select('*').order('creado_en'),
  sb.from('sm_robot_operaciones').select('robot_id,estado,resultado_r'),
  sb.from('sm_velas').select('ticker,barras')]);
 S.err=a.error?a.error.message:null;S.scan=a.data?.[0]||null;S.pos=b.data||[];S.robots=c.data||[];S.ops=d.data||[];S.velas={};(e.data||[]).forEach(v=>S.velas[v.ticker]=v.barras);try{await cargarLab()}catch(x){}try{await cargarCmd()}catch(x){}try{await cargarDec()}catch(x){}try{await cargarVerd()}catch(x){}try{await cargarSen()}catch(x){}try{await cargarCer()}catch(x){}try{await cargarPush()}catch(x){}}
const APP_VER='2026-10-21.3';S.errs=[];
window.addEventListener('error',e=>{S.errs.push((new Date().toISOString().slice(11,19))+' '+String(e.message||e).slice(0,160))});
window.addEventListener('unhandledrejection',e=>{S.errs.push((new Date().toISOString().slice(11,19))+' promesa: '+String(e.reason&&e.reason.message||e.reason).slice(0,160))});
function textoFallo(){const sc=S.scan,c=S.cmd,tz='America/Tijuana';
 return['Reporte de fallo de SwingMom (pégalo en Claude)','App versión '+APP_VER+' · escáner '+(sc?sc.version:'—'),'Hora Tijuana: '+new Date().toLocaleString('es-MX',{timeZone:tz}),
  'Último escaneo: '+(sc?new Date(sc.creado_en).toLocaleString('es-MX',{timeZone:tz}):'ninguno'),'Pedido de escaneo: '+(c?c.estado+' ('+new Date(c.creado_en).toLocaleString('es-MX',{timeZone:tz})+')':'ninguno'),
  'Avisos: '+(S.push&&S.push.est)+' · Pestaña: '+S.tab+(S.det?' · Detalle: '+S.det:''),'Veredictos cargados: '+(S.verd||[]).length+' · Posiciones: '+S.pos.length+' abiertas, '+(S.cer||[]).length+' cerradas',
  'Errores recientes: '+(S.errs.length?S.errs.slice(-5).join(' | '):'ninguno'),'Navegador: '+navigator.userAgent.slice(0,120),'','Qué intentaba hacer y qué pasó: '].join('\n')}
function csv(filas,cols){const q=v=>{if(v==null)return'';const t=typeof v==='object'?JSON.stringify(v):String(v);return/[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};return[cols.join(',')].concat(filas.map(f=>cols.map(c=>q(f[c])).join(','))).join('\n')}
async function descargar(nombre,texto,btn){const o=btn.textContent;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+texto],{type:'text/csv;charset=utf-8'}));a.download=nombre;document.body.appendChild(a);a.click();a.remove();btn.textContent='Descargado ✓'}catch(e){await copiar(texto,btn);return}setTimeout(()=>{btn.textContent=o},2500)}
function respaldoBox(){return`<h2>Respaldo</h2><div class="card pad"><p class="muted" style="margin:0 0 8px;font-size:13px">Descarga una copia de tus datos antes de hacer cambios grandes. Si el teléfono no permite descargar, se copia al portapapeles.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" id="bk-pos" style="margin-top:0;min-height:42px;font-size:15px;flex:1">Posiciones</button><button class="btn sec" id="bk-dec" style="margin-top:0;min-height:42px;font-size:15px;flex:1">Diario</button><button class="btn sec" id="bk-ver" style="margin-top:0;min-height:42px;font-size:15px;flex:1">Veredictos</button></div></div>`}
function accionesRespaldo(){const f=hoyTJ();
 const a=$('#bk-pos');if(a)a.onclick=async()=>{const r=await sb.from('sm_posiciones').select('*').order('abierta_en',{ascending:false}).limit(5000);if(r.error){alert('No se pudo leer: '+r.error.message);return}descargar('swingmom_posiciones_'+f+'.csv',csv(r.data,['cuenta','tipo','ticker','acciones','entrada','stop','stop_inicial','tp','estado','abierta_en','cerrada_en','salida','pnl_usd','stop_real','clase','notas']),a)};
 const b=$('#bk-dec');if(b)b.onclick=async()=>{const r=await sb.from('sm_decisiones').select('*').order('creado_en',{ascending:false}).limit(5000);if(r.error){alert('No se pudo leer: '+r.error.message);return}descargar('swingmom_diario_'+f+'.csv',csv(r.data,['fecha','tipo','titulo','cuerpo_md','contexto']),b)};
 const c=$('#bk-ver');if(c)c.onclick=async()=>{const r=await sb.from('sm_veredictos').select('*').order('creado_en',{ascending:false}).limit(5000);if(r.error){alert('No se pudo leer: '+r.error.message);return}descargar('swingmom_veredictos_'+f+'.csv',csv(r.data,['creado_en','ticker','veredicto','resumen','modelo']),c)}}
function comoDecideBox(){return`<details class="card pad" style="margin-top:16px"><summary style="font-weight:600;cursor:pointer">Cómo decide el escáner</summary><div class="s" style="margin-top:10px;line-height:1.5">
 <p style="margin:0 0 8px"><b>1. Busca estructura técnica.</b> Revisa 85 acciones al día: tendencia (medias 50/150/200), fuerza relativa contra el mercado, cercanía al máximo anual y contracción del precio. A cada una le pone un puntaje.</p>
 <p style="margin:0 0 8px"><b>2. Las separa por clase.</b> Núcleo (puntaje 190 o más): arriesgas 2%. Calificada: arriesgas 1%. El resto solo lo sigue un robot de práctica con dinero simulado.</p>
 <p style="margin:0 0 8px"><b>3. Por eso casi siempre hay pocas señales.</b> La ventaja real es chica (alrededor de +0.31R por operación en el núcleo), así que la regla es pocas entradas, bien dimensionadas.</p>
 <p style="margin:0 0 8px"><b>4. Lo que NO ve el escáner:</b> noticias, dilución, litigios, insiders ni el riesgo de que varias acciones del mismo sector caigan juntas. Por eso cada señal pasa por la lista «Antes de entrar» y por la verificación con Claude.</p>
 <p style="margin:0">Reglas duras: earnings a más de 21 días, sin tope de posiciones abiertas ni por sector (el riesgo total sí se vigila), no promediar a la baja, y el stop siempre como orden real en IBKR.</p></div></details>`}
function pieHoy(){return`<div style="margin:20px 4px 0;display:flex;gap:10px;align-items:center;justify-content:space-between"><span class="muted" style="font-size:12px">App ${APP_VER}${S.scan?' · escáner '+esc(S.scan.version):''}</span><button class="linkbtn" id="rf">Reportar un fallo</button></div><div id="rfm"></div>`}
S.verd=[];S.lote=null;S.pv=null;S.cer=[];
async function cargarCer(){const r=await sb.from('sm_posiciones').select('*').eq('estado','cerrada').order('cerrada_en',{ascending:false}).limit(200);S.cer=r.data||[]}
const SECT=()=>{const m={};(S.scan?.payload.results||[]).forEach(r=>{if(r.sector)m[r.ticker]=r.sector});return m};
function exposicion(){const ib=S.pos.filter(p=>p.cuenta==='IBKR'&&p.tipo!=='apalancada'),sec=SECT();let riesgo=0,sinStop=0,sinStopReal=0;const porSector={};
 ib.forEach(p=>{if(p.stop&&p.entrada&&p.acciones)riesgo+=Math.max(0,(p.entrada-p.stop)*p.acciones);else sinStop++;if(p.stop_real!==true)sinStopReal++;const z=sec[p.ticker]||'(sin sector)';porSector[z]=(porSector[z]||0)+1});
 return{n:ib.length,riesgo,sinStop,sinStopReal,porSector,pct:riesgo/CAP*100}}
function riesgoBox(){const e=exposicion();if(!S.pos.length)return'';const col=e.pct>10?'var(--bad)':e.pct>7?'var(--warn,#b26a00)':'inherit';
 return`<div class="card pad" style="margin-top:12px"><div class="row"><span class="k">Riesgo abierto (IBKR)</span><span class="v" style="color:${col}">${money(e.riesgo)} · ${e.pct.toFixed(1)}%</span></div><div class="row"><span class="k">Posiciones abiertas · sin tope</span><span class="v">${e.n}</span></div>${e.sinStopReal?`<div class="row"><span class="k">Sin stop real confirmado</span><span class="v dn">${e.sinStopReal}</span></div>`:''}</div>`}
function alertasPosBox(){const a=(S.scan&&S.scan.payload&&S.scan.payload.alertas_posiciones)||[];if(!a.length)return'';
 const cls={rojo:'bad',amarillo:'warn',verde:'ok'},nom={rojo:'Urgente',amarillo:'Atención',verde:'Objetivo'};
 return`<h2>Tus posiciones · alertas de este escaneo</h2><div class="card pad">${a.slice(0,8).map(x=>`<div class="s" style="margin-top:6px"><span class="pill ${cls[x.nivel]||''}" style="margin:0 6px 0 0">${nom[x.nivel]||''}</span>${esc(x.texto)}</div>`).join('')}${a.length>8?`<p class="muted" style="margin:8px 0 0;font-size:13px">…y ${a.length-8} más.</p>`:''}<p class="muted" style="margin:8px 0 0;font-size:12px">Se calculan al escanear (mediodía y bajo demanda), no minuto a minuto.</p></div>`}
function antesDeEntrar(r){const sz=sizing(r),e=exposicion(),sec=r.sector||'(sin sector)',nSec=e.porSector[sec]||0,v=verdVigente(r.ticker);
 const enCartera=S.pos.some(p=>p.ticker===r.ticker);const ext=r.e21?(r.price/r.e21-1)*100:null;const riesgoNuevo=sz?sz.riesgo:0,pctTot=(e.riesgo+riesgoNuevo)/CAP*100;
 const L=[];const add=(n,t,d)=>L.push({n,t,d});
 add(r.earn_days==null?'warn':r.earn_days>21?'ok':'bad','Earnings a más de 21 días',r.earn_days==null?'Sin dato de earnings: confirma la fecha':r.earn_days+' días');
 add(r.large_drop_today?'bad':'ok','No es día de caída fuerte',r.large_drop_today?'Hoy cayó fuerte: veto confirmado en el backtest':'Sin caída fuerte hoy');
 add(enCartera||r.ya_en_otra_cuenta?'bad':'ok','No está ya en cartera',enCartera?'Ya la tienes: no promediar a la baja':r.ya_en_otra_cuenta?'Ya está en la otra cuenta':'Libre');
 add('ok','Sin tope de posiciones',e.n+' abiertas (sin límite de cantidad; el riesgo total sí se vigila)');
 add('ok','Sector sin tope',nSec+' abiertas en '+sec+' (sin límite; las del mismo sector suelen moverse juntas, ojo con el riesgo total)');
 add(pctTot<=10?'ok':'warn','Riesgo total de cartera',money(e.riesgo+riesgoNuevo)+' · '+pctTot.toFixed(1)+'% con esta operación (referencia ≤ 10%)');
 add(ext==null?'warn':ext<=12?'ok':'warn','Extensión sobre EMA21',ext==null?'Sin dato':ext.toFixed(1)+'%'+(ext>12?' · evalúa esperar un retroceso':''));
 add(!v?'warn':(v.veredicto==='ENTRAR'&&v.confianza!=='BAJA')?'ok':(v.veredicto==='ENTRAR'||v.veredicto==='ENTRAR_REDUCIDO')?'warn':'bad','Veredicto de Claude de hoy',v?etiquetaVerd(v):'Falta verificar con Claude');
 add(S.scan&&S.scan.mercado_ok?'ok':'warn','Mercado',S.scan&&S.scan.mercado_ok?'Sobre EMA50':'Aviso (no es veto)');
 const nb=L.filter(x=>x.n==='bad').length,nw=L.filter(x=>x.n==='warn').length;const ic={ok:'✓',warn:'!',bad:'✕'};

 else if(!e.llave)est=`<div class="card pad"><div class="t">Falta un paso (una sola vez)</div><p class="muted" style="margin:6px 0 0">Claude necesita tu llave de Anthropic API. Se guarda solo en el servidor; esta app nunca la ve.</p><ol class="steps"><li>Crea la llave en <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com → API keys</a> y cópiala.</li><li>Si es tu primera vez, agrega saldo en <a href="https://console.anthropic.com/settings/billing" target="_blank" rel="noopener">Billing</a> (con $10 alcanza para semanas).</li><li>Pégala en <a href="https://supabase.com/dashboard/project/xbmdgrxceuttvbactugw/functions/secrets" target="_blank" rel="noopener">Supabase → Edge Functions → Secrets</a>, con el nombre <b>ANTHROPIC_API_KEY</b>.</li></ol><button class="btn" id="cre">Ya la pegué — revisar</button></div>`;
 else est=`<div class="muted" style="margin:6px 4px 0">Conectado · ${esc((e.modelo||'').replace('claude-',''))}</div>`;
 const ban=S.ctx&&listo?`<div class="card pad"><div class="t">Verificar ${esc(S.ctx)}</div><p class="muted" style="margin:4px 0 0">Estructura del escáner + búsqueda de noticias, dilución, earnings, insiders y sector. Termina con veredicto y niveles.</p><button class="btn" id="cvr">Lanzar verificación</button></div>`:'';
 const sug=listo&&!CL.msgs.length&&!S.ctx?`<div class="chips">${['Verifica las señales núcleo de hoy','¿Cómo está el mercado hoy?','¿Cómo van mis robots?'].map(x=>`<button data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:'';
 const nuevo=CL.msgs.length?`<button class="linkbtn" id="cnu">Nueva conversación</button>`:'';
 app.innerHTML=`<div class="sub">Con tu cartera y el escáner como contexto</div><h1>Claude</h1>${est}${ban}${sug}${CL.err?`<div class="aviso">${esc(CL.err)}</div>`:''}<div id="msgs"></div>${nuevo}<div style="height:76px"></div>
 <div class="composer"><textarea id="cin" rows="1" placeholder="${listo?'Pregunta lo que quieras…':'Disponible cuando Claude esté conectado'}" ${listo?'':'disabled'}></textarea><button id="csd" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>`;
 const cin=$('#cin');cin.value=CL.draft||'';const ajusta=()=>{cin.style.height='auto';cin.style.height=Math.min(cin.scrollHeight,120)+'px'};ajusta();
 cin.oninput=()=>{CL.draft=cin.value;ajusta()};cin.onkeydown=ev=>{if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();$('#csd').click()}};
 $('#csd').onclick=()=>{clEnviar(cin.value,'chat',null)};
 const cre=$('#cre');if(cre)cre.onclick=async()=>{CL.estado=null;claudeTab();await clEstado();if(S.tab==='claude')claudeTab()};
 const cvr=$('#cvr');if(cvr)cvr.onclick=()=>{const tk=S.ctx;S.ctx=null;claudeTab();clEnviar(`Verifica ${tk} con el protocolo completo y dame el veredicto con niveles.`,'verificar',tk)};
 app.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>clEnviar(b.dataset.q,'chat',null));
 const cnu=$('#cnu');if(cnu)cnu.onclick=()=>{try{localStorage.setItem('clDesde',new Date().toISOString())}catch(x){}CL.msgs=[];CL.err=null;claudeTab()};
 pintarChat();
 if(!e)clEstado().then(()=>{if(S.tab==='claude')claudeTab()});
 if(!CL.cargado)clCargar().then(()=>{if(S.tab==='claude')pintarChat()}).catch(()=>{CL.cargado=true})}

function render(){nav();if(S.det&&S.scan)return detalle();({hoy,cartera,lab,claude:claudeTab})[S.tab]()}
const cargarScripts=()=>['esquema.js','lab.js'].reduce((p,f)=>p.then(()=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=f;e.onload=ok;e.onerror=()=>no(new Error('No cargó '+f));document.head.appendChild(e)})),Promise.resolve());
async function start(){if(!sb)return sinClave();try{await cargarScripts()}catch(e){app.innerHTML='<p class="muted">'+esc(e.message)+'</p>';return}app.innerHTML='<p class="muted">Cargando…</p>';await load();if(S.err){try{localStorage.removeItem('smk')}catch(e){}return sinClave('No se pudo leer con esta clave ('+S.err+'). Abre de nuevo tu enlace privado.')}render()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
